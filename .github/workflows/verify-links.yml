name: Verify links

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
      - run: npm install --global pnpm@10.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify generated external links
        run: node scripts/verify-links.mjs --input dist/index.html --stamp-file src/content/link-verification.json
      - name: Commit verification stamp only
        run: |
          if git diff --quiet src/content/link-verification.json; then exit 0; fi
          git config user.name "link-verifier[bot]"
          git config user.email "link-verifier@noctis.biz"
          git add src/content/link-verification.json
          git commit -m "chore: refresh verified-link date"
          git push
